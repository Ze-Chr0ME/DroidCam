ï»¿[package]
name = "camerabridge-desktop"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "CameraBridge"
path = "src/main.rs"

[dependencies]
camerabridge-core = { path = "../core" }
serde_json = "1"
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
sha2 = "0.10"
getrandom = "0.2"
subtle = "2"
openh264 = "0.9"
qrcode = { version = "0.14", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange"] }
